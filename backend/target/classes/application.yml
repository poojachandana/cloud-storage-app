server:
  port: 8080

spring:
  application:
    name: cloud-storage-backend

  # ---- H2 (default, zero setup, in-memory) ----
  datasource:
    url: jdbc:h2:file:./data/clouddb;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console

  # ---- To switch to PostgreSQL, comment the H2 block above, uncomment this,
  #      uncomment the postgresql dependency in pom.xml, and set your own values ----
  # datasource:
  #   url: jdbc:postgresql://localhost:5432/cloudstorage
  #   username: postgres
  #   password: postgres
  #   driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

app:
  jwt:
    secret: "ChangeThisSecretKeyToSomethingLongAndRandomInProductionPlease123!"
    expiration-ms: 86400000 # 24 hours
  storage:
    base-path: ./storage
  cors:
    allowed-origins: "http://localhost:5173"
  public-link:
    base-url: "http://localhost:8080/api/public-links"

logging:
  level:
    com.cloudstorage: INFO
